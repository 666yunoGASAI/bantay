# Tests Bantay itself on every push and pull request (patrol data commits are skipped).
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['site/data/**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Typecheck, unit and status-page tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - name: Monitors compile and are discoverable
        run: npx playwright test -c playwright.monitors.config.ts --list
      - run: npx playwright install --with-deps chromium
      - run: npm run test:page
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: status-page-report
          path: playwright-report/
          retention-days: 14
