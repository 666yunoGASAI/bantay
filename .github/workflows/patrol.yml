# The patrol: runs every monitor against the live sites on a schedule,
# opens/closes GitHub issues, alerts Discord, and commits fresh data for the status page.
name: Patrol

on:
  schedule:
    - cron: '17 */3 * * *' # every 3 hours at :17 (the top of the hour is GitHub's busiest time)
  workflow_dispatch:
    inputs:
      chaos:
        description: 'Chaos drill: deliberately fail one check to test issues and alerts end to end'
        type: boolean
        default: false

permissions:
  contents: write # commit site/data
  issues: write # open and close incident issues

concurrency:
  group: patrol # never two patrols at once: they'd fight over site/data
  cancel-in-progress: false

jobs:
  patrol:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Patrol
        run: npm run patrol
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BANTAY_CHAOS: ${{ inputs.chaos && '1' || '' }}

      - name: Upload report, traces and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: patrol-report
          path: bantay-results/
          retention-days: 14

      - name: Save results for the status page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then exit 0; fi
          up=$(jq '[.checks[] | select(.status == "up")] | length' site/data/current.json)
          total=$(jq '.checks | length' site/data/current.json)
          git commit -m "patrol: ${up}/${total} up [skip ci]"
          git pull --rebase origin main
          git push
